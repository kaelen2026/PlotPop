name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A superseded push has nothing to prove; let the newer run take the runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint needs the commits the pull request adds, not just the tip.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Derived from `engines.node`, so the runtime is not pinned twice.
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Runs over the whole repository, not just staged files: the local hook can
      # be skipped with `--no-verify`, this cannot.
      - name: Lint and format
        run: pnpm lint

      - name: Conventional commits
        if: github.event_name == 'pull_request'
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

  # Runs beside the quality gates rather than after them: an image that cannot
  # start is worth knowing about in the same minute as a failing test.
  images:
    name: Container image (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      # One service failing should not hide the state of the other.
      fail-fast: false
      matrix:
        include:
          - service: api
            port: 3001
          - service: worker
            port: 3002
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.service }}.Dockerfile
          # Loaded into the local daemon instead of pushed: this job proves the
          # image runs, it does not publish anything.
          load: true
          tags: plotpop-${{ matrix.service }}:ci

      - name: Start and health-check
        run: docker/smoke.sh plotpop-${{ matrix.service }}:ci ${{ matrix.service }} ${{ matrix.port }}
