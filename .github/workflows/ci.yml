name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A superseded push has nothing to prove; let the newer run take the runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint needs the commits the pull request adds, not just the tip.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Derived from `engines.node`, so the runtime is not pinned twice.
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `next.config.ts` parses the web environment, so `pnpm build` needs one.
      # `.env.example` is the right source: `packages/config`'s tests parse it, so
      # it is always a complete and valid environment, and a newly required
      # variable cannot break this job separately from breaking those tests.
      - name: Local environment
        run: cp .env.example .env

      # Runs over the whole repository, not just staged files: the local hook can
      # be skipped with `--no-verify`, this cannot.
      - name: Lint and format
        run: pnpm lint

      - name: Conventional commits
        if: github.event_name == 'pull_request'
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

  # Separate from the quality gates because it needs a database. `.claude/rules/tdd.md`
  # §6 keeps Postgres unmocked: the constraints and transactions these tests rely
  # on only exist in a real server.
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: plotpop
          POSTGRES_PASSWORD: plotpop
          POSTGRES_DB: plotpop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plotpop -d plotpop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://plotpop:plotpop@localhost:5432/plotpop
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Integration tests
        run: pnpm test:integration

  # Behaviour and accessibility in a real browser. Separate from the quality
  # gates, and from the visual job below, so each reports on its own: a failing
  # screenshot must not hide a broken keyboard path.
  #
  # This job receives no secrets, and it never will. `.claude/rules/tdd.md` §6
  # forbids CI from calling a real paid generation provider, and the structural
  # guarantee is that there is nothing here to authenticate with — a spec that
  # reaches for a real provider fails at configuration parsing, which is the
  # cheapest possible place to find out.
  #
  # PostgreSQL is here because the gates run against a real api: the chain from the
  # browser through Next's rewrite to Better Auth and a provisioned workspace is
  # what these specs are for, and every link of it is configuration that fails
  # silently.
  #
  # Object storage is here for the same reason. `.claude/rules/tdd.md` §6 makes it a
  # mocked boundary everywhere else, so this is the only layer that proves the api
  # signs a url the browser can reach, that MinIO accepts a cross-origin PUT of
  # exactly the signed length, and that the signed GET serves the bytes back (§26).
  #
  # Redis is still absent — nothing under test needs a queue — which is why the api is
  # waited on at `/health` rather than `/ready`.
  browser:
    name: Browser gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: plotpop
          POSTGRES_PASSWORD: plotpop
          POSTGRES_DB: plotpop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plotpop -d plotpop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Playwright web server builds and serves the app, so it needs the same
      # environment `pnpm build` does; see the quality gates job.
      - name: Local environment
        run: cp .env.example .env

      # Not a service container: the `minio/minio` image needs a `server` subcommand,
      # and a service block cannot supply one. Brought up from the compose file local
      # development already uses, so the pinned image and the bucket the api expects
      # are declared once rather than drifting between here and a developer's machine.
      # The published port matches the endpoints in `.env.example`.
      - name: Object storage
        run: |
          docker compose -f docker/compose.yaml up --detach --wait minio
          docker compose -f docker/compose.yaml up --exit-code-from minio-bucket minio-bucket

      # `--with-deps` installs the system libraries the browser needs; the browser
      # build itself belongs to the pinned @playwright/test version.
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      # Builds and serves the web app itself, so there is no separate build step.
      - name: End to end and accessibility
        run: pnpm test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-browser
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Visual regression runs through the same script a developer runs, which starts
  # the pinned Playwright container. The renderer, and therefore the baseline, is
  # identical in both places; see `.claude/rules/tdd.md` §5.
  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      # The script reads the installed Playwright version to pick its image tag.
      - run: pnpm install --frozen-lockfile

      # The repository is bind mounted into the container, so the web server
      # inside it reads this file; see the quality gates job.
      - name: Local environment
        run: cp .env.example .env

      - name: Compare against the committed baselines
        run: pnpm test:e2e:visual

      # The diff images are how a baseline gets updated: read the report, decide
      # whether the change was intended, then redraw with
      # `pnpm test:e2e:visual --update-snapshots`.
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-visual
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Runs beside the quality gates rather than after them: an image that cannot
  # start is worth knowing about in the same minute as a failing test.
  images:
    name: Container image (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      # One service failing should not hide the state of the other.
      fail-fast: false
      matrix:
        include:
          - service: api
            port: 3001
          - service: worker
            port: 3002
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.service }}.Dockerfile
          # Loaded into the local daemon instead of pushed: this job proves the
          # image runs, it does not publish anything.
          load: true
          tags: plotpop-${{ matrix.service }}:ci

      - name: Start and health-check
        run: docker/smoke.sh plotpop-${{ matrix.service }}:ci ${{ matrix.service }} ${{ matrix.port }}
